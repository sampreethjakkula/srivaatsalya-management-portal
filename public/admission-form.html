<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inter Admission Form - Sri Vaatsalya Academy</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* --- GLOBAL STYLES --- */
        :root {
            --primary-blue: #0a3d62;
            --accent-gold: #d4af37;
            --bg-light: #f4f7f9;
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.6; padding: 40px 20px; display: flex; justify-content: center; }

        /* --- FORM CONTAINER --- */
        .form-container {
            background: var(--white);
            width: 100%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            padding: 50px;
            position: relative;
        }

        /* --- HEADER --- */
        .form-header { text-align: center; margin-bottom: 40px; border-bottom: 2px solid var(--bg-light); padding-bottom: 20px; }
        .form-header h1 { color: var(--primary-blue); font-size: 28px; font-weight: 800; margin-bottom: 10px; }
        .form-header p { color: var(--text-muted); font-size: 15px; }

        /* --- FORM SECTIONS --- */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--primary-blue);
            margin: 30px 0 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .section-title i { color: var(--accent-gold); }

        /* --- GRID LAYOUT --- */
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .form-group.full-width { grid-column: span 2; }
        
        label { font-size: 14px; font-weight: 600; color: var(--text-dark); }
        label span { color: #e11d48; } /* Required asterisk */

        /* --- INPUTS --- */
        input[type="text"], input[type="tel"], input[type="date"], select, textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            font-family: inherit;
            color: var(--text-dark);
            background: #f8fafc;
            transition: 0.3s;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary-blue);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(10, 61, 98, 0.1);
        }

        textarea { resize: vertical; min-height: 80px; }

        /* --- RADIO BUTTONS --- */
        .radio-group { display: flex; gap: 20px; margin-top: 5px; }
        .radio-label { display: flex; align-items: center; gap: 8px; font-weight: 500; cursor: pointer; }
        input[type="radio"] { accent-color: var(--primary-blue); width: 18px; height: 18px; cursor: pointer; }

        /* --- SUBMIT BUTTON --- */
        .submit-btn {
            background: var(--primary-blue);
            color: var(--white);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            margin-top: 30px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .submit-btn:hover { background: #072a44; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(10, 61, 98, 0.2); }

        /* --- RESPONSIVE --- */
        @media(max-width: 650px) {
            .form-container { padding: 30px 20px; }
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="form-container">
        
        <div class="form-header">
            <h1>Intermediate Admission Form</h1>
            <p>Please fill out the details below to apply for Intermediate (MPC / BiPC).</p>
        </div>

        <!-- FORM ACTION LINKED TO hr@evenbreakhr.com -->
        <form action="#" method="POST" id="admissionForm">
            
            <!-- FormSubmit Configuration -->
            <input type="hidden" name="_subject" value="New Inter Admission Application">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            
            <!-- SECTION 1: STUDENT DETAILS -->
            <div class="section-title"><i class="fa-solid fa-user-graduate"></i> Student Details</div>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Student Full Name <span>*</span></label>
                    <input type="text" name="Student_Name" placeholder="Enter student's full name" required>
                </div>
                
                <div class="form-group">
                    <label>Date of Birth <span>*</span></label>
                    <input type="date" name="DOB" required>
                </div>
                
                <div class="form-group">
                    <label>Gender <span>*</span></label>
                    <div class="radio-group">
                        <label class="radio-label"><input type="radio" name="Gender" value="Male" required> Male</label>
                        <label class="radio-label"><input type="radio" name="Gender" value="Female"> Female</label>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>Inter Group & Coaching Applying For <span>*</span></label>
                    <select name="Inter_Group" required>
                        <option value="" disabled selected>Select Group & Coaching</option>
                        
                        <optgroup label="MPC">
                            <option value="MPC - JEE Main">MPC - JEE Main</option>
                            <option value="MPC - JEE Advanced">MPC - JEE Advanced</option>
                            <option value="MPC - EAPCET">MPC - EAPCET</option>
                        </optgroup>
                        
                        <optgroup label="BiPC">
                            <option value="BiPC - NEET">BiPC - NEET</option>
                            <option value="BiPC - EAPCET">BiPC - EAPCET</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <!-- SECTION 2: PARENT / GUARDIAN DETAILS -->
            <div class="section-title"><i class="fa-solid fa-users"></i> Parent / Guardian Details</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>Father's Name <span>*</span></label>
                    <input type="text" name="Father_Name" placeholder="Enter father's name" required>
                </div>
                <div class="form-group">
                    <label>Mother's Name <span>*</span></label>
                    <input type="text" name="Mother_Name" placeholder="Enter mother's name" required>
                </div>
                
                <div class="form-group full-width">
                    <label>Primary Contact Number <span>*</span></label>
                    <input type="tel" name="Phone" placeholder="Enter 10-digit mobile number" required>
                </div>

                <div class="form-group full-width">
                    <label>Residential Address <span>*</span></label>
                    <textarea name="Address" placeholder="Enter full residential address" required></textarea>
                </div>
            </div>

            <!-- SECTION 3: 10TH CLASS DETAILS -->
            <div class="section-title"><i class="fa-solid fa-school"></i> 10th Class Details</div>
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Name of Previous School (10th) <span>*</span></label>
                    <input type="text" name="Previous_School" placeholder="Enter 10th school name" required>
                </div>
                <div class="form-group full-width">
                    <label>10th Class Percentage / GPA <span>*</span></label>
                    <input type="text" name="Tenth_Percentage" placeholder="e.g., 85% or 9.2 GPA" required>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Submit Application <i class="fa-solid fa-paper-plane"></i></button>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';

            const formData = new FormData(this);
            const payload = {
                studentName: formData.get('Student_Name'),
                dob: formData.get('DOB'),
                gender: formData.get('Gender'),
                course: formData.get('Inter_Group'),
                fatherName: formData.get('Father_Name'),
                motherName: formData.get('Mother_Name'),
                phone: formData.get('Phone'),
                address: formData.get('Address'),
                previousSchool: formData.get('Previous_School'),
                tenthMarks: formData.get('Tenth_Percentage')
            };

            try {
                const res = await window.SchoolAPI.submitAdmission(payload);
                if (res.success) {
                    alert('✓ Admission Application Submitted Successfully!\nOur counseling team will contact you shortly.');
                    window.location.href = './index.html';
                } else {
                    alert('Submission error: ' + (res.message || 'Please check form details.'));
                }
            } catch (err) {
                alert('Submission failed: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Submit Application <i class="fa-solid fa-paper-plane"></i>';
            }
        });
    </script>
</body>
</html>
